<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeoRank SEO - Local Google Rank Tracker{% endblock %}</title>
    <!-- Local Self-Contained Stylesheet (No internet or external CDN required) -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <header>
        <div class="header-container">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div>
                    <div class="brand-title">GeoRank <span>SEO</span></div>
                    <div class="brand-sub">Google Local SERP Rank Checker</div>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 14px;">
                <div class="status-pill">
                    <div class="status-dot"></div>
                    <span>Flask API Online</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>© 2026 GeoRank SEO Tracker • Powered by Google Canonical UULE Geo-Targeting & Flask</p>
            <p>100% Offline & Local UI • Zero CDN Dependencies</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
